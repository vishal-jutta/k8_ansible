---
- name: Deploy Jenkins on OpenShift
  hosts: localhost
  gather_facts: false

  vars:
    namespace: jenkins
    app_name: jenkins
    jenkins_image: "quay.io/openshift/origin-jenkins:4.13"

  tasks:

    - name: Ensure namespace exists
      kubernetes.core.k8s:
        api_version: v1
        kind: Namespace
        name: "{{ namespace }}"
        state: present

    - name: Create Persistent Volume Claim for Jenkins
      kubernetes.core.k8s:
        state: present
        namespace: "{{ namespace }}"
        definition:
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: jenkins-pvc
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 5Gi

    - name: Create Jenkins Deployment
      kubernetes.core.k8s:
        namespace: "{{ namespace }}"
        state: present
        definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: "{{ app_name }}"
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: "{{ app_name }}"
            template:
              metadata:
                labels:
                  app: "{{ app_name }}"
              spec:
                serviceAccountName: jenkins
                containers:
                  - name: jenkins
                    image: "{{ jenkins_image }}"
                    ports:
                      - containerPort: 8080
                      - containerPort: 50000
                    volumeMounts:
                      - name: jenkins-home
                        mountPath: /var/lib/jenkins
                volumes:
                  - name: jenkins-home
                    persistentVolumeClaim:
                      claimName: jenkins-pvc

    - name: Create Jenkins Service
      kubernetes.core.k8s:
        namespace: "{{ namespace }}"
        state: present
        definition:
          apiVersion: v1
          kind: Service
          metadata:
            name: "{{ app_name }}"
          spec:
            selector:
              app: "{{ app_name }}"
            ports:
              - name: web
                port: 8080
                targetPort: 8080
              - name: jnlp
                port: 50000
                targetPort: 50000

    - name: Create Jenkins Route
      kubernetes.core.k8s:
        namespace: "{{ namespace }}"
        state: present
        definition:
          apiVersion: route.openshift.io/v1
          kind: Route
          metadata:
            name: "{{ app_name }}"
          spec:
            to:
              kind: Service
              name: "{{ app_name }}"
            port:
              targetPort: web
